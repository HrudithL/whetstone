<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marrow — Know what your tests actually cover</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(135deg, #0a0e27 0%, #12152f 100%);
      color: #e8eaf6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .hero {
      max-width: 720px;
      text-align: center;
    }

    .eyebrow {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 0.875rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #00d9ff;
      margin-bottom: 2rem;
      font-weight: 500;
      opacity: 0.9;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .subtext {
      font-size: 1.125rem;
      line-height: 1.7;
      color: #b3bdd9;
      margin-bottom: 2.5rem;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #00d9ff;
      color: #0a0e27;
      padding: 1rem 2.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 10px 30px rgba(0, 217, 255, 0.2);
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: #00f2ff;
      box-shadow: 0 15px 40px rgba(0, 217, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn-primary:focus {
      outline: 2px solid #00d9ff;
      outline-offset: 2px;
    }

    .btn-secondary {
      background: none;
      color: #00d9ff;
      border: none;
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      padding: 0.5rem 1.5rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-secondary:hover {
      color: #00f2ff;
      text-decoration: underline;
    }

    .btn-secondary:focus {
      outline: 2px solid #00d9ff;
      outline-offset: 2px;
      border-radius: 0.25rem;
    }

    .trust-line {
      font-size: 0.9375rem;
      color: #9099b7;
      letter-spacing: 0.01em;
    }

    /* Responsive */
    @media (max-width: 640px) {
      h1 {
        font-size: 2rem;
      }

      .subtext {
        font-size: 1rem;
      }

      .btn-primary {
        font-size: 1rem;
        padding: 0.875rem 2rem;
      }

      .btn-secondary {
        font-size: 1rem;
      }

      .cta-group {
        gap: 0.75rem;
      }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }

      .btn-primary:hover {
        transform: none;
      }
    }

    /* Focus visible for keyboard navigation */
    *:focus-visible {
      outline: 2px solid #00d9ff;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="eyebrow">Open source · MIT</div>
    <h1>Know what your tests actually cover.</h1>
    <p class="subtext">Marrow watches a single test run and draws the real map from test to code — no coverage annotations, no config. Find the dead tests. Find the untested lines. In one command.</p>

    <div class="cta-group">
      <button class="btn-primary" onclick="alert('Install command would open here')">Install Marrow</button>
      <a href="#docs" class="btn-secondary">Read the docs</a>
    </div>

    <div class="trust-line">Works with pytest, Jest, and go test.</div>
  </div>
</body>
</html>
