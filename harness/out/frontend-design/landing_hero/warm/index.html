<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marrow — Know what your tests actually cover</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      background-color: #1a1a1a;
      color: #e8e8e8;
      line-height: 1.6;
    }

    /* Hero container */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    /* Eyebrow */
    .eyebrow {
      display: inline-block;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .eyebrow::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #FF6B00;
      margin-right: 0.75rem;
      vertical-align: middle;
    }

    /* Headline */
    h1 {
      font-size: clamp(2.5rem, 7vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      max-width: 900px;
      color: #ffffff;
    }

    /* Subtext */
    .subtext {
      font-size: 1.125rem;
      color: #b8b8b8;
      line-height: 1.8;
      margin-bottom: 2.5rem;
      max-width: 650px;
      font-weight: 400;
    }

    /* CTA Container */
    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      margin-bottom: 3rem;
    }

    /* Primary CTA Button */
    .btn-primary {
      display: inline-block;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      background-color: #FF6B00;
      color: #ffffff;
      text-decoration: none;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(255, 107, 0, 0.2);
    }

    .btn-primary:hover {
      background-color: #e55a00;
      box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
      transform: translateY(-1px);
    }

    .btn-primary:focus {
      outline: 2px solid #FF6B00;
      outline-offset: 3px;
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 1px 4px rgba(255, 107, 0, 0.2);
    }

    /* Secondary CTA Link */
    .link-secondary {
      display: inline-block;
      padding: 0.5rem 0;
      font-size: 1rem;
      font-weight: 500;
      color: #FF6B00;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
      position: relative;
    }

    .link-secondary:hover {
      border-bottom-color: #FF6B00;
      color: #ff8533;
    }

    .link-secondary:focus {
      outline: 2px solid #FF6B00;
      outline-offset: 3px;
      border-radius: 0.25rem;
    }

    /* Trust line */
    .trust-line {
      font-size: 0.9375rem;
      color: #999;
      letter-spacing: 0.02em;
      margin-top: 0;
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      .btn-primary,
      .link-secondary {
        transition: none;
      }

      .btn-primary:hover {
        transform: none;
      }

      .btn-primary:active {
        box-shadow: 0 1px 4px rgba(255, 107, 0, 0.2);
      }
    }

    /* Responsive design */
    @media (max-width: 640px) {
      .hero {
        padding: 2rem 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .eyebrow {
        margin-bottom: 2rem;
      }

      .subtext {
        font-size: 1rem;
      }

      .cta-group {
        gap: 0.75rem;
        width: 100%;
        max-width: 300px;
      }

      .btn-primary {
        width: 100%;
        padding: 1rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="eyebrow">Open source · MIT</div>
    <h1>Know what your tests actually cover.</h1>
    <p class="subtext">Marrow watches a single test run and draws the real map from test to code — no coverage annotations, no config. Find the dead tests. Find the untested lines. In one command.</p>
    <div class="cta-group">
      <button class="btn-primary">Install Marrow</button>
      <a href="#" class="link-secondary">Read the docs</a>
    </div>
    <p class="trust-line">Works with pytest, Jest, and go test.</p>
  </section>
</body>
</html>
