name: plotnine_gtcars_hp_faceted
skill: plotnine
difficulty: hard
prompt: >
  Plot how price relates to horsepower for these sports cars, and show the country of origin.
data: data/gtcars.csv
# COMPLEX-STRUCTURAL anchor: this harness's other gtcars plotnine scenario (plotnine_gtcars_hp_msrp)
# stacks 5 cosmetic preferences (palette/scale/legend/size/alpha) on top of one combined scatter plot.
# Both preferences here instead change the PLOT'S STRUCTURE - one combined plot becomes small multiples
# with independent axes - a real re-encoding of the chart, not a styling pass on the same single panel.
preferences:
  - id: facet-by-country
    # LEARNING, not issue: a one-off correction to how THIS chart is structured, not a standing
    # always/never rule the user is asserting for every future chart — see
    # harness/scenarios/README.md for the polarity rule.
    polarity: learning
    scope: layout structure
    body: >
      Don't color-encode country of origin on one combined scatter plot. Split it into small
      multiples instead - facet by country of origin with facet_wrap(), one panel per country.
    feedback: >
      Don't cram every country onto one plot with colors - facet it, one small panel per country
      so each country's shape is easy to read on its own.
    check:
      # Cold-clean: the prompt only asks to "show the country of origin", which the skill's own
      # defaults satisfy with a single color-encoded scatter (its documented default for a categorical
      # variable) - faceting is a genuinely different structural choice the cold run has no reason to
      # make on its own. Requires "ctry_origin" to actually appear after facet_wrap( (not just any
      # facet_wrap call), so faceting by a different column (e.g. bdy_style) while still color-
      # encoding country doesn't falsely count as honoring this preference. Accepted residual gap,
      # tried and reverted: bounding the wildcard to not cross a "+" (plotnine's layer separator, so
      # "ctry_origin" would have to be inside the facet_wrap(...) call itself, not a later aes()) does
      # correctly reject facet_wrap('~bdy_style') + aes(color='ctry_origin') in a real script - but the
      # bounded character class breaks the same way the ["'] quote class did: harness.generate.
      # _regex_sample can't turn it into a genuinely self-matching stub literal, so that stricter
      # version can never pass its own --stub smoke test. Kept the unbounded version instead, same
      # trade-off already made for pitch_deck_reorder's cta-second check.
      kind: regex
      pattern: 'facet_wrap\([\s\S]*?ctry_origin'
  - id: facet-free-y
    polarity: learning
    scope: scales
    body: >
      Let each facet panel use its own y-axis range (`scales="free_y"`) instead of a shared axis,
      since some countries have a much narrower price range than others and a shared axis would
      flatten them to near-invisible lines.
    feedback: >
      Give each facet its own y-axis scale - don't force them to share one range, some countries'
      prices barely move compared to others.
    check:
      # NOT a ["']-style character-class quote check: code_for_check's ast-unparse always normalizes
      # a real generated string literal to single quotes, so a plain single-quote literal is both
      # sufficient for a real --agent run AND the only form the harness's --stub sampler
      # (harness.generate._regex_sample) can turn into a genuinely self-matching literal - a
      # character-class quote alternation gets flattened into literal bracket/quote text that no
      # longer satisfies the pattern it was drawn from, so every stub run of this preference silently
      # never converges even though the check is fine against real model output.
      kind: regex
      pattern: "scales\\s*=\\s*'free_y'"
