name: pitch_deck
skill: pptx
difficulty: medium
prompt: >
  Build the 5-slide "Marrow" pitch deck described in the outline. Write deck.py using python-pptx
  and run it to produce deck.pptx.
data: data/pitch_deck_outline.md
preferences:
  - id: mono-font
    polarity: learning
    scope: typography
    # Contrarian house style: decks default to a sans-serif like Calibri; a monospace face on every
    # slide is this user's specific taste, not an objectively better choice.
    body: >
      Set every text run's font to Consolas (`run.font.name = "Consolas"`) — titles and body, on
      all slides.
    feedback: >
      Use Consolas for all the slide text, not the default sans-serif.
    check:
      # PRIOR VERSION (reverted — a real, observed false negative): a literal `code_contains` on
      # `font.name = 'Consolas'` assumed the assignment is always a direct string literal. A live
      # model just as often factors it into a constant (`FONT = "Consolas"` then `run.font.name =
      # FONT`, observed on every run of a real deck.py that genuinely does set Consolas throughout) —
      # the literal check failed on every single one of those runs, a false negative, not a real miss.
      # Two independent presence lookaheads instead: "Consolas" appears somewhere, AND some
      # `font.name` assignment appears somewhere — tolerates any indirection style. Still cold-clean:
      # a cold run's default sans-serif deck contains neither "Consolas" nor (checked against a real
      # committed cold run) any coincidental co-occurrence.
      kind: regex
      pattern: '(?=[\s\S]*Consolas)(?=[\s\S]*font\.name\s*=)'
  - id: square-format
    # LEARNING, not issue: a deliberately unusual house taste ("I like my decks square"), not a
    # standing always/never rule stated as one (contrast towny_growth_trends.yaml's density-magenta,
    # phrased as "Never fill growth with green here (house rule)" — that phrasing is what earns
    # `issue`, not that a preference happens to be a single deck-level setting or a big change from
    # the default). See harness/scenarios/README.md for the polarity rule.
    polarity: learning
    scope: aspect ratio
    # A single DECK-LEVEL setting (not per-slide), so its presence honors it fully — no partial-
    # compliance gap. Crucially it is cold-clean: normal decks are 4:3/16:9 with height 7.5in, so a
    # cold run never sets slide_height to 10in (checking width=10 would false-positive — cold sets
    # 4:3 width).
    body: >
      Use a SQUARE 1:1 slide format: set `prs.slide_width = Inches(10)` AND
      `prs.slide_height = Inches(10)` on the Presentation (import Inches from `pptx.util`).
    feedback: >
      Make the deck square (1:1), not the usual 4:3/16:9 — set prs.slide_width = Inches(10) and
      prs.slide_height = Inches(10).
    check:
      # Deck-level, single-point, and cold-clean: only a square deck sets HEIGHT to 10in (normal
      # decks are 7.5in tall). AST-unparse normalizes spacing around `=`, so spelling doesn't matter.
      kind: code_contains
      pattern: slide_height = Inches(10)
