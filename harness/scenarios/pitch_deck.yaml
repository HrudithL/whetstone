name: pitch_deck
skill: pptx
difficulty: medium
prompt: >
  Build the 5-slide "Marrow" pitch deck described in the outline. Write deck.py using python-pptx
  and run it to produce deck.pptx.
data: data/pitch_deck_outline.md
preferences:
  - id: mono-font
    polarity: learning
    scope: typography
    # Contrarian house style: decks default to a sans-serif like Calibri; a monospace face on every
    # slide is this user's specific taste, not an objectively better choice.
    body: >
      Set every text run's font to Consolas (`run.font.name = "Consolas"`) — titles and body, on
      all slides.
    feedback: >
      Use Consolas for all the slide text, not the default sans-serif.
    check:
      kind: code_contains
      pattern: Consolas
  - id: right-align-titles
    polarity: issue
    scope: title alignment
    # A hard rule (issue) and a deliberately unusual one: slide titles are near-universally left- or
    # center-aligned, so right-aligning every title is a distinctive taste a cold run won't reach for
    # (left/center DO show up in cold decks, which is why the preference targets RIGHT specifically).
    body: >
      Right-align every slide title: set the title paragraph's alignment to PP_ALIGN.RIGHT
      (`from pptx.enum.text import PP_ALIGN`).
    feedback: >
      Right-align every slide title (PP_ALIGN.RIGHT) — don't leave them left/center aligned.
    check:
      kind: code_contains
      pattern: PP_ALIGN.RIGHT
