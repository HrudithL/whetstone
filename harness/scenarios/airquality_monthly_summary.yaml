name: airquality_monthly_summary
difficulty: medium
prompt: >
  Create a table comparing the average temperature, wind speed, and ozone level for each month in the
  air-quality data.
data: data/airquality.csv
preferences:
  - id: one-decimal
    polarity: learning
    scope: number formatting
    body: >
      Round the temperature, wind, and ozone values to one decimal place.
    feedback: >
      Keep those numbers to one decimal place.
    check:
      kind: regex
      pattern: decimals\s*=\s*1
  - id: labels-darkgreen
    polarity: learning
    scope: header styling
    # Stylistic + against the default: the skill's column-label band is a light grey (#F0F0F0). A
    # saturated dark-green header with white text is this user's look, not something cold reaches for.
    body: >
      Style the column-label row with a dark green background (#0B6E4F) and white text — apply it to
      loc.column_labels() with style.fill(color="#0B6E4F") and style.text(color="white").
    feedback: >
      Make the column labels dark green (#0B6E4F) with white text.
    check:
      # Case-insensitive: models occasionally lowercase a hex they were handed.
      kind: regex
      pattern: "(?i)#0b6e4f"
