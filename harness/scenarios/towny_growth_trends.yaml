name: towny_growth_trends
skill: great-tables
difficulty: hard
prompt: >
  Create a table showing population-density growth for the 15 fastest-growing Ontario towns,
  comparing density across the census years from 1996 to 2021, with the percentage change between
  each period.
data: data/towny.csv
preferences:
  - id: pct-force-sign
    polarity: learning
    scope: percentage formatting
    body: >
      Show the percentage-change columns as percentages with an explicit + sign on positive values.
    feedback: >
      The percent-change columns should show a + on gains.
    check:
      kind: regex
      pattern: force_sign\s*=\s*True
  - id: density-magenta
    polarity: issue
    scope: color encoding
    # A hard house rule (ISSUE) that deliberately overrides the default: the skill signals
    # growth/nature with a forest green, so this shop's standing rule is "growth is magenta, never
    # green" — a stylistic house identity, enforced as a constraint rather than a soft taste.
    body: >
      Never fill growth with green here (house rule). Heat-map the density columns with a magenta ramp
      instead — use the ColorBrewer `PuRd` palette via data_color(columns=[...], palette="PuRd").
    feedback: >
      House rule: growth is magenta (use the PuRd palette), never green.
    check:
      kind: code_contains
      pattern: PuRd
