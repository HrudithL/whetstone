name: pitch_deck_reorder
skill: pptx
difficulty: hard
prompt: >
  Build the 5-slide "Marrow" pitch deck described in the outline, in the order given. Write deck.py
  using python-pptx and run it to produce deck.pptx.
data: data/pitch_deck_outline.md
# COMPLEX-STRUCTURAL anchor: this harness's other pptx scenario (pitch_deck.yaml) teaches font/aspect-
# ratio - a deck-level style setting layered on top of an unchanged slide sequence. Both preferences
# here instead change the SLIDE SEQUENCE ITSELF (reorder + insert), which is a real restructuring of
# the deck's narrative, not a cosmetic pass over the same 5 slides.
#
# KNOWN, ACCEPTED LIMITATION on both checks below (raised, correctly, across two rounds of review):
# they run over `deck.py` SOURCE TEXT (via code_for_check), which cannot see actual slide count/
# order the way opening the committed `deck.pptx` binary with python-pptx would - a helper-function
# definition (containing "Install Marrow") written before another helper (containing "Big test
# suites") but INVOKED in the original order would satisfy cta-second's text-order check without the
# deck ever being reordered; similarly, ordinary setup/styling code alone could in principle supply
# why-now-slide's required character counts without "Why now" ever landing on its own slide. Fixing
# this properly means a new check kind that inspects the rendered .pptx - but `--stub` mode never
# produces a real .pptx at all (only `--agent` does; see SkillSpec.required_artifacts), so that would
# mean designing a wholly different, binary-only verification story for `--stub` on these two
# preferences specifically, not just a check tweak. Given every real `--agent` run this PR verified
# against (multiple, differently-styled) shows the checks correctly distinguishing honored from
# not-honored, and this exact category of residual gap ("checks work over generated source text, not
# a rendered artifact") is already accepted throughout this harness's other checks, this is left as a
# documented limitation rather than new check-kind infrastructure.
preferences:
  - id: cta-second
    # LEARNING, not issue: a one-off correction to THIS deck's narrative order, not a standing
    # always/never rule the user is asserting for every future deck — see
    # harness/scenarios/README.md for the polarity rule.
    polarity: learning
    scope: slide order
    body: >
      Don't save the call-to-action for last. Move the "Install Marrow" call-to-action slide to be
      the SECOND slide - right after the title, before the problem/idea/how-it-works slides. Lead
      with the install command, then explain why it matters.
    feedback: >
      Put the "Install Marrow" slide right after the title - don't bury the call-to-action at the
      end, lead with it.
    check:
      # PRIOR VERSION (reverted — a real, observed false negative, not hypothetical): required two
      # "add_slide(" calls before "Install Marrow", to tie the text order to the actual slide-add
      # call sequence. That assumed every slide is built with a direct `prs.slides.add_slide(...)`
      # call — but a live model just as often (observed on real committed runs, both before and
      # after this fix) factors slide creation into a one-line helper (`def new_slide(): ...
      # add_slide(...) ...` called as `slide = new_slide()` per slide), so "add_slide(" appears only
      # ONCE in the whole file regardless of how many slides exist, and the ">= 2 add_slide(" check
      # failed on every single run of a real deck that WAS correctly reordered — a check false
      # negative, exactly the kind of "says it didn't happen when it did" bug this harness exists to
      # avoid. Dropped the call-counting requirement entirely: content order alone — "Install Marrow"
      # (the CTA's own on-slide title) before "Big test suites" (the problem slide's own on-slide
      # title) — is what a reordered deck's source text actually looks like, independent of whatever
      # helper/variable names the model happens to choose that run. Cold-clean: the outline lists the
      # CTA last and the prompt says "in the order given", so a cold run writes "Big test suites"
      # before "Install Marrow", never the reverse.
      kind: regex
      pattern: 'Install Marrow[\s\S]*Big test suites'
  - id: why-now-slide
    polarity: learning
    scope: slide structure
    body: >
      Insert a new slide titled "Why now" between "The idea" and "How it works", making the case that
      test suites have grown large enough that manual coverage tracking has become untenable - this
      is new content the outline doesn't ask for, added because it strengthens the pitch.
    feedback: >
      Add a "Why now" slide in between the idea and how-it-works slides - explain why this problem
      is urgent today, not just that it exists.
    check:
      # PRIOR VERSION (reverted — same real false-negative class as cta-second's check above): tied
      # "add_slide(" being the token immediately before "Why now" to prove a genuinely NEW slide
      # (not "Why now" bolted onto the idea or how-it-works slide as a subtitle). That again assumed
      # a direct `add_slide(` call per slide, which a real model's helper-function style defeats —
      # observed failing on every run of a real deck.py that DID insert the slide correctly. Replaced
      # the code-structure requirement with a minimum-content-length gate on EACH side of "Why now":
      # at least 150 characters between "Watch one run" and "Why now", and at least 80 between "Why
      # now" and "How it works". A single one-sided gate (caught by Codex review — a real gap, not
      # hypothetical: a subtitle bolted directly onto the idea slide would still have ~80 chars of
      # the how-it-works slide's own setup code before its title, satisfying a "Why now" -> gap ->
      # "How it works" check alone) is why BOTH sides now need real distance — a "Why now" glued to
      # either neighboring slide's own content has a small gap on THAT side, which a two-sided gate
      # catches; a genuinely separate slide has a full slide's worth of setup code (new-slide call +
      # textbox positioning + title styling) on both sides. Verified this still matches a real
      # honored run (gaps of 385/469 chars) and rejects a synthetic bolted-on-subtitle sample.
      # Cold-clean: the outline has no "Why now" slide at all, so a cold run never produces this
      # sequence regardless of the gate. Known --stub-only gap (same trade-off already accepted for
      # facet-by-country/cta-second elsewhere in this harness): generate._regex_sample has no general
      # handling for a bounded/unbounded quantifier like `{150,}` (it does not expand a character
      # class into N literal repeats), so it cannot synthesize a self-matching stub literal for this
      # check — the free `--stub` smoke test never converges for `why-now-slide`, though the check is
      # correct and honors properly against a real `--agent` run.
      kind: regex
      pattern: 'Watch one run[\s\S]{150,}?Why now[\s\S]{80,}How it works'
