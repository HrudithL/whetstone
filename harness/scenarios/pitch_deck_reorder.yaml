name: pitch_deck_reorder
skill: pptx
difficulty: hard
prompt: >
  Build the 5-slide "Marrow" pitch deck described in the outline, in the order given. Write deck.py
  using python-pptx and run it to produce deck.pptx.
data: data/pitch_deck_outline.md
# COMPLEX-STRUCTURAL anchor: this harness's other pptx scenario (pitch_deck.yaml) teaches font/aspect-
# ratio - a deck-level style setting layered on top of an unchanged slide sequence. Both preferences
# here instead change the SLIDE SEQUENCE ITSELF (reorder + insert), which is a real restructuring of
# the deck's narrative, not a cosmetic pass over the same 5 slides.
preferences:
  - id: cta-second
    polarity: issue
    scope: slide order
    body: >
      Don't save the call-to-action for last. Move the "Install Marrow" call-to-action slide to be
      the SECOND slide - right after the title, before the problem/idea/how-it-works slides. Lead
      with the install command, then explain why it matters.
    feedback: >
      Put the "Install Marrow" slide right after the title - don't bury the call-to-action at the
      end, lead with it.
    check:
      # Literal source-text order alone is a weak proxy for slide-build order - a helper defined near
      # the top of the script could contain "Install Marrow" while still being called last, so a bare
      # "Install Marrow ... Big test suites" order check could pass on a deck that was never reordered.
      # Requiring two "add_slide(" calls before "Install Marrow" ties it to the actual slide-add call
      # sequence (proving the CTA text isn't part of slide 1), on top of the existing before-the-
      # problem-slide check. This assumes the straightforward, single top-to-bottom script a 5-slide
      # deck like this one is expected to produce (consistent with pitch_deck.yaml's checks, which
      # assume the same non-abstracted style) - not airtight against a deliberately indirect helper-
      # function structure, but this harness's checks work over generated source text, not a rendered
      # deck, so a perfect structural guarantee isn't available here.
      # Cold-clean: the outline lists the CTA last and the prompt says "in the order given", so a cold
      # run reproduces that order (CTA content after problem content, and after only 1 add_slide call).
      kind: regex
      pattern: 'add_slide\([\s\S]*?add_slide\([\s\S]*?Install Marrow[\s\S]*?Big test suites'
  - id: why-now-slide
    polarity: learning
    scope: slide structure
    body: >
      Insert a new slide titled "Why now" between "The idea" and "How it works", making the case that
      test suites have grown large enough that manual coverage tracking has become untenable - this
      is new content the outline doesn't ask for, added because it strengthens the pitch.
    feedback: >
      Add a "Why now" slide in between the idea and how-it-works slides - explain why this problem
      is urgent today, not just that it exists.
    check:
      # A bare presence check would count a "Why now" slide inserted anywhere (e.g. appended at the
      # end) as honoring a preference that specifically asks for it BETWEEN the idea and how-it-works
      # slides. Anchoring on "Watch one run" (the idea slide's own on-slide tagline, per the outline)
      # and "How it works" (that slide's on-slide title - the outline gives it no separate quoted
      # tagline, so the model has every reason to reuse this literal label) proves "Why now" falls
      # textually between them. Cold-clean: the outline has no "Why now" slide at all, so a cold run
      # never produces this whole 3-way sequence.
      kind: regex
      pattern: 'Watch one run[\s\S]*Why now[\s\S]*How it works'
