project:
  type: website
  output-dir: _site
  # Execute page code from the project dir (docs/) so `_showcase.py` imports resolve consistently.
  execute-dir: project
  # site.js is pulled in via include-after-body (a <script src>), so list it as a resource to
  # guarantee it is copied into _site.
  resources:
    - site.js

website:
  title: "Whetstone"
  description: "A local MCP server that makes any skill learn from use — and the proof that it does."
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: concepts.qmd
        text: Concepts
      - href: triptych.qmd
        text: Before / After
      - href: metrics.qmd
        text: Metrics
      - href: methodology.qmd
        text: Methodology
      - text: Docs
        menu:
          - href: install.qmd
            text: Install & quickstart
          - href: tools.qmd
            text: Tools
    right:
      - icon: github
        href: https://github.com/HrudithL/whetstone
        aria-label: GitHub
  page-footer:
    center: "Whetstone — the website and its numbers are generated from real runs; see Methodology."

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    css: styles.css
    # Inter (UI/prose) + JetBrains Mono (code/CLI); the design system in theme.scss expects them.
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
          <script>document.documentElement.classList.add('ws-anim');</script>
    # Progressive-enhancement JS (copy-to-clipboard + scroll reveal); site works without it.
    # onerror drops .ws-anim if site.js fails to load, so .ws-reveal content can never be left
    # hidden when JS is enabled but the script is missing.
    include-after-body:
      - text: |
          <script src="site.js" onerror="document.documentElement.classList.remove('ws-anim')"></script>
    toc: true
    code-fold: true
    code-tools: true
    grid:
      body-width: 1100px
