name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref so only the latest push is validated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic job on the default `hashing` backend — no torch, no network. Runs on every
  # push and is the primary signal. Excludes the sentence-transformers calibration tests. Matrixed
  # across both Python versions in `requires-python` (previously only 3.12 was ever actually
  # tested despite the >=3.11 floor) and all three OSes — the store's file locking is real
  # `fcntl`/`msvcrt` platform code now, and git invocation's `core.hooksPath` differs by OS, so
  # this is the only real way to verify the Windows/macOS paths (not just POSIX-by-default).
  test:
    name: test (hashing, py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (base + dev)
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test (hashing backend)
        # --cov-fail-under is set a few points below the measured baseline (94%), not a guessed
        # target, so it's a real floor from day one rather than an aspirational number.
        run: pytest -m "not embeddings" -q --cov=whetstone --cov-report=term-missing --cov-fail-under=90

  # mypy over the package (not harness/tests). Separate job so a type-check failure is easy to spot
  # apart from a test failure.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (base + dev)
        run: pip install -e '.[dev]'
      - name: mypy
        run: mypy src/whetstone

  # Separate job on the real sentence-transformers backend: verifies the semantic behavior
  # (dedup-by-paraphrase, conflict detection, retrieval relevance) that the thresholds are
  # calibrated for. Heavier (installs torch, downloads the model) so pip + the Hugging Face model
  # cache keep warm runs fast; it never gates the fast `test` job above.
  test-embeddings:
    name: test (sentence-transformers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install (base + dev + embeddings)
        run: pip install -e '.[dev,embeddings]'
      - name: Test (sentence-transformers backend)
        run: pytest -m embeddings -q
