name: Pages

# Render the Quarto showcase (docs/) at the site root AND the great-docs API/MCP reference at /docs,
# then deploy the combined tree to GitHub Pages as a single artifact. Neither build runs the harness
# or drives a model — the showcase only reads committed harness/out/, and great-docs introspects the
# installed whetstone package — so this needs no API key. Deploys on merge to main (only
# whetstone-<milestone> roots reach main) or on demand.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "harness/out/**"
      - "harness/scenarios/**"
      - "great-docs.yml"
      - "src/**"
      - ".github/scripts/gen_llms_txt.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let queued runs finish in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site render deps (jupyter engine + charts + great-docs)
        run: |
          python -m pip install --upgrade pip
          # [showcase] carries the root site's render deps (jupyter, ipykernel, matplotlib, pyyaml,
          # great-tables); [docs] carries great-docs for the /docs reference. No [embeddings] extra:
          # neither site runs sentence-transformers.
          pip install -e ".[showcase,docs]"
          python -m ipykernel install --user --name python3

      - name: Render root showcase site (docs/ -> docs/_site)
        env:
          QUARTO_PYTHON: python
        run: quarto render docs

      - name: Build great-docs reference (great-docs/_site)
        env:
          QUARTO_PYTHON: python
        # Introspects the installed whetstone package: auto-generates the MCP tool reference from the
        # FastMCP @mcp.tool() functions. site_url in great-docs.yml points at the /docs subpath.
        run: great-docs build

      - name: Generate llms.txt / llms-full.txt (upstream gap workaround)
        # great-docs links these on the landing page but only writes them for packages with a Python
        # api-reference; Whetstone has an MCP reference, so we synthesize them from the built
        # mcp.json. See GREAT_DOCS_SPIKE.md (Gap 2).
        run: python .github/scripts/gen_llms_txt.py great-docs/_site

      - name: Assemble combined tree (root showcase + great-docs at /docs)
        run: |
          rm -rf _deploy && mkdir -p _deploy
          cp -R docs/_site/. _deploy/
          mkdir -p _deploy/docs
          cp -R great-docs/_site/. _deploy/docs/
          test -f _deploy/index.html
          test -f _deploy/docs/index.html
          test -f _deploy/docs/reference/mcp/recall.html
          test -f _deploy/docs/llms.txt
          test -f _deploy/docs/llms-full.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - id: deploy
        uses: actions/deploy-pages@v4
